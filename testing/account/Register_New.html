<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrieren</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            overflow: hidden;
        }

        .image-section {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .image-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 0, 0, 0.1) 0%, transparent 50%);
            animation: gradientShift 8s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .graphic {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
            padding: 40px;
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .graphic svg {
            width: 180px;
            height: 180px;
            margin-bottom: 30px;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.2));
        }

        .graphic h2 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .graphic p {
            font-size: 15px;
            opacity: 0.95;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .form-section {
            flex: 1;
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #1a1a1a;
            position: relative;
            z-index: 2;
            overflow-y: auto;
        }

        .form-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .form-header h1 {
            font-size: 36px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .form-header p {
            color: #888;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 14px;
            background: #2a2a2a;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            background: #333;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .form-group input::placeholder {
            color: #666;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .form-row .form-group {
            margin-bottom: 0;
        }

        .password-strength {
            font-size: 12px;
            margin-top: 6px;
            height: 4px;
            background: #333;
            border-radius: 2px;
            overflow: hidden;
        }

        .password-strength-bar {
            height: 100%;
            background: #888;
            width: 0%;
            transition: all 0.3s ease;
        }

        .password-strength-bar.weak {
            background: #ff6b6b;
            width: 33%;
        }

        .password-strength-bar.medium {
            background: #ffd93d;
            width: 66%;
        }

        .password-strength-bar.strong {
            background: #51cf66;
            width: 100%;
        }

        .checkbox-group {
            display: flex;
            align-items: flex-start;
            margin: 20px 0;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
            margin-top: 2px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .checkbox-group label {
            margin: 0;
            text-transform: none;
            font-weight: normal;
            font-size: 12px;
            color: #888;
            cursor: pointer;
            line-height: 1.5;
        }

        .submit-button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .submit-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
        }

        .login-link {
            text-align: center;
            margin-top: 16px;
            font-size: 13px;
            color: #888;
        }

        .login-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: #764ba2;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }

            .image-section {
                min-height: 250px;
                padding: 20px;
            }

            .form-section {
                padding: 30px 20px;
            }

            .form-header h1 {
                font-size: 28px;
            }

            .graphic svg {
                width: 120px;
                height: 120px;
            }

            .graphic h2 {
                font-size: 22px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }
        }

        /* Loading State */
        .submit-button.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .submit-button.loading::after {
            content: ' ⏳';
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Linke Seite mit Grafik -->
        <div class="image-section">
            <div class="graphic">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- User Icon -->
                    <circle cx="50" cy="30" r="12" stroke="white" stroke-width="2.5" fill="none"/>
                    <path d="M35 55C35 47 41.7 41 50 41C58.3 41 65 47 65 55V68H35V55Z" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
                <h2>Treten Sie bei</h2>
                <p>Erstellen Sie ein neues Konto</p>
            </div>
        </div>

        <!-- Rechte Seite mit Formular -->
        <div class="form-section">
            <div class="form-header">
                <h1>Registrieren</h1>
                <p>Füllen Sie die Felder aus</p>
            </div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="email">E-Mail-Adresse</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Ihre E-Mail-Adresse"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="username">Benutzername</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        placeholder="Benutzername"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Passwort</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Passwort (min. 8 Zeichen)"
                        required
                    >
                    <div class="password-strength">
                        <div class="password-strength-bar"></div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Passwort wiederholen</label>
                    <input 
                        type="password" 
                        id="confirmPassword" 
                        name="confirmPassword" 
                        placeholder="Passwort wiederholen"
                        required
                    >
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">Ich akzeptiere die Nutzungsbedingungen und die Datenschutzrichtlinie</label>
                </div>

                <button type="submit" class="submit-button">Konto erstellen</button>

                <div class="login-link">
                    Bereits angemeldet? <a href="Login_New.html">Zum Login</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const registerForm = document.getElementById('registerForm');
        const submitButton = registerForm.querySelector('.submit-button');
        const passwordInput = document.getElementById('password');
        const strengthBar = document.querySelector('.password-strength-bar');

        // Passwort-Stärke Anzeige
        passwordInput.addEventListener('input', function() {
            const strength = calculatePasswordStrength(this.value);
            strengthBar.className = 'password-strength-bar ' + strength;
        });

        function calculatePasswordStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.length >= 12) strength++;
            if (/[a-z]/.test(password) && /[A-Z]/.test(password)) strength++;
            if (/\d/.test(password)) strength++;
            if (/[!@#$%^&*]/.test(password)) strength++;

            if (strength <= 2) return 'weak';
            if (strength <= 3) return 'medium';
            return 'strong';
        }

        registerForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const termsAccepted = document.getElementById('terms').checked;

            // Validierungen
            if (!email || !username || !password || !confirmPassword) {
                alert('Bitte füllen Sie alle Felder aus.');
                return;
            }

            if (!email.includes('@')) {
                alert('Bitte geben Sie eine gültige E-Mail-Adresse ein.');
                return;
            }

            if (username.length < 3) {
                alert('Der Benutzername muss mindestens 3 Zeichen lang sein.');
                return;
            }

            if (password.length < 8) {
                alert('Das Passwort muss mindestens 8 Zeichen lang sein.');
                return;
            }

            if (password !== confirmPassword) {
                alert('Die Passwörter stimmen nicht überein.');
                return;
            }

            if (!termsAccepted) {
                alert('Bitte akzeptieren Sie die Nutzungsbedingungen.');
                return;
            }

            // Loading-Status
            submitButton.classList.add('loading');
            submitButton.disabled = true;

            // Simulierte Registrierung
            setTimeout(() => {
                alert('Registrierung erfolgreich! Willkommen ' + username + '!');
                submitButton.classList.remove('loading');
                submitButton.disabled = false;
                registerForm.reset();
                strengthBar.className = 'password-strength-bar';
            }, 2000);
        });

        // Enter-Taste zum Absenden
        document.getElementById('confirmPassword').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                registerForm.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
