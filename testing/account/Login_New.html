<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .login-container {
            display: flex;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            box-shadow: none;
            border-radius: 0;
            overflow: hidden;
        }

        .login-image {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100%;
            position: relative;
            overflow: hidden;
        }

        .login-image::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 0, 0, 0.1) 0%, transparent 50%);
            animation: gradientShift 8s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .login-graphic {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
            padding: 40px;
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .login-graphic svg {
            width: 180px;
            height: 180px;
            margin-bottom: 30px;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.2));
        }

        .login-graphic h2 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .login-graphic p {
            font-size: 15px;
            opacity: 0.95;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .login-form-section {
            flex: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #1a1a1a;
            position: relative;
            z-index: 2;
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .form-header h1 {
            font-size: 36px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .form-header p {
            color: #888;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 14px;
            background: #2a2a2a;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            background: #333;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .form-group input::placeholder {
            color: #666;
        }

        .login-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .login-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: #666;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: #333;
        }

        .divider span {
            padding: 0 10px;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            color: #666;
        }

        .signup-link {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #888;
        }

        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .signup-link a:hover {
            color: #764ba2;
        }

        .forgot-password {
            text-align: right;
            margin-top: 12px;
        }

        .forgot-password a {
            font-size: 12px;
            color: #888;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .forgot-password a:hover {
            color: #667eea;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin: 18px 0;
        }

        .checkbox-group input[type="checkbox"] {
            width: auto;
            margin-right: 8px;
            cursor: pointer;
            accent-color: #667eea;
        }

        .checkbox-group label {
            margin: 0;
            text-transform: none;
            font-weight: normal;
            font-size: 13px;
            color: #888;
            cursor: pointer;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }

            .login-image {
                min-height: 250px;
                padding: 20px;
            }

            .login-form-section {
                padding: 40px 25px;
            }

            .form-header h1 {
                font-size: 28px;
            }

            .login-graphic svg {
                width: 120px;
                height: 120px;
            }

            .login-graphic h2 {
                font-size: 22px;
            }
        }

        /* Loading State */
        .login-button.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .login-button.loading::after {
            content: ' ⏳';
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Linke Seite mit Grafik -->
        <div class="login-image">
            <div class="login-graphic">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Lock Icon -->
                    <rect x="25" y="50" width="50" height="35" rx="3" stroke="white" stroke-width="2" fill="none"/>
                    <path d="M35 50V35C35 26.7 41.7 20 50 20C58.3 20 65 26.7 65 35V50" stroke="white" stroke-width="2" fill="none"/>
                    <circle cx="50" cy="70" r="3" fill="white"/>
                </svg>
                <h2>Willkommen</h2>
                <p>Melden Sie sich an, um fortzufahren</p>
            </div>
        </div>

        <!-- Rechte Seite mit Formular -->
        <div class="login-form-section">
            <div class="form-header">
                <h1>Login</h1>
                <p>Geben Sie Ihre Anmeldedaten ein</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">E-Mail oder Benutzername</label>
                    <input 
                        type="text" 
                        id="email" 
                        name="email" 
                        placeholder="E-Mail oder Benutzername"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="password">Passwort</label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        placeholder="Passwort"
                        required
                    >
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="remember" name="remember">
                    <label for="remember">Anmeldedaten speichern</label>
                </div>

                <button type="submit" class="login-button">Anmelden</button>

                <div class="forgot-password">
                    <a href="Password_Reset_New.html">Passwort vergessen?</a>
                </div>

                <div class="divider">
                    <span>ODER</span>
                </div>

                <div class="signup-link">
                    Noch kein Konto? <a href="Register_New.html">Jetzt registrieren</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const loginForm = document.getElementById('loginForm');
        const loginButton = loginForm.querySelector('.login-button');

        loginForm.addEventListener('submit', function(e) {
            e.preventDefault();

            // Validierung
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!email || !password) {
                alert('Bitte füllen Sie alle Felder aus.');
                return;
            }

            if (email.length < 3) {
                alert('Bitte geben Sie eine gültige E-Mail oder einen Benutzernamen ein.');
                return;
            }

            if (password.length < 6) {
                alert('Das Passwort muss mindestens 6 Zeichen lang sein.');
                return;
            }

            // Loading-Status
            loginButton.classList.add('loading');
            loginButton.disabled = true;

            // Simulierte Anfrage (ersetzen Sie mit echtem Backend)
            setTimeout(() => {
                alert('Login erfolgreich!');
                loginButton.classList.remove('loading');
                loginButton.disabled = false;
                loginForm.reset();
            }, 2000);
        });

        // Enter-Taste zum Absenden
        document.getElementById('password').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                loginForm.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
