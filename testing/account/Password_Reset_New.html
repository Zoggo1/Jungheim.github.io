<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passwort zurücksetzen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
            background: #0a0a0a;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            overflow: hidden;
        }

        .container {
            display: flex;
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            overflow: hidden;
        }

        .image-section {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
        }

        .image-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: 
                radial-gradient(circle at 20% 50%, rgba(255, 255, 255, 0.1) 0%, transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 0, 0, 0.1) 0%, transparent 50%);
            animation: gradientShift 8s ease-in-out infinite;
        }

        @keyframes gradientShift {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.8; }
        }

        .graphic {
            position: relative;
            z-index: 1;
            text-align: center;
            color: white;
            padding: 40px;
            animation: slideIn 0.8s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .graphic svg {
            width: 180px;
            height: 180px;
            margin-bottom: 30px;
            filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.2));
        }

        .graphic h2 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 12px;
        }

        .graphic p {
            font-size: 15px;
            opacity: 0.95;
            font-weight: 300;
            letter-spacing: 0.3px;
        }

        .form-section {
            flex: 1;
            padding: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            background: #1a1a1a;
            position: relative;
            z-index: 2;
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .form-header h1 {
            font-size: 36px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
        }

        .form-header p {
            color: #888;
            font-size: 14px;
        }

        .info-box {
            background: rgba(102, 126, 234, 0.1);
            border-left: 3px solid #667eea;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 30px;
            font-size: 13px;
            color: #aaa;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: #ffffff;
            margin-bottom: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input {
            width: 100%;
            padding: 14px 16px;
            border: 1px solid #333;
            border-radius: 6px;
            font-size: 14px;
            background: #2a2a2a;
            color: #ffffff;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            background: #333;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
        }

        .form-group input::placeholder {
            color: #666;
        }

        .submit-button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 12px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .submit-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.5);
        }

        .submit-button:active {
            transform: translateY(0);
            box-shadow: 0 2px 10px rgba(102, 126, 234, 0.3);
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            font-size: 13px;
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: #764ba2;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                flex-direction: column;
                height: auto;
                min-height: 100vh;
            }

            .image-section {
                min-height: 250px;
                padding: 20px;
            }

            .form-section {
                padding: 40px 25px;
            }

            .form-header h1 {
                font-size: 28px;
            }

            .graphic svg {
                width: 120px;
                height: 120px;
            }

            .graphic h2 {
                font-size: 22px;
            }
        }

        /* Loading State */
        .submit-button.loading {
            opacity: 0.7;
            pointer-events: none;
        }

        .submit-button.loading::after {
            content: ' ⏳';
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Linke Seite mit Grafik -->
        <div class="image-section">
            <div class="graphic">
                <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Email Icon -->
                    <rect x="15" y="25" width="70" height="50" rx="3" stroke="white" stroke-width="2" fill="none"/>
                    <path d="M15 25L50 50L85 25" stroke="white" stroke-width="2" fill="none" stroke-linecap="round"/>
                </svg>
                <h2>Passwort zurücksetzen</h2>
                <p>Geben Sie Ihre E-Mail-Adresse ein</p>
            </div>
        </div>

        <!-- Rechte Seite mit Formular -->
        <div class="form-section">
            <div class="form-header">
                <h1>Passwort vergessen?</h1>
                <p>Kein Problem, wir helfen Ihnen</p>
            </div>

            <div class="info-box">
                Geben Sie die E-Mail-Adresse ein, die mit Ihrem Konto verknüpft ist, und wir senden Ihnen Anweisungen zum Zurücksetzen Ihres Passworts.
            </div>

            <form id="resetForm">
                <div class="form-group">
                    <label for="email">E-Mail-Adresse</label>
                    <input 
                        type="email" 
                        id="email" 
                        name="email" 
                        placeholder="Ihre E-Mail-Adresse"
                        required
                    >
                </div>

                <button type="submit" class="submit-button">Zurücksetzen-Link senden</button>

                <div class="back-link">
                    <a href="Login_New.html">Zurück zum Login</a>
                </div>
            </form>
        </div>
    </div>

    <script>
        const resetForm = document.getElementById('resetForm');
        const submitButton = resetForm.querySelector('.submit-button');

        resetForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value.trim();

            if (!email) {
                alert('Bitte geben Sie Ihre E-Mail-Adresse ein.');
                return;
            }

            if (!email.includes('@')) {
                alert('Bitte geben Sie eine gültige E-Mail-Adresse ein.');
                return;
            }

            submitButton.classList.add('loading');
            submitButton.disabled = true;

            setTimeout(() => {
                alert('Ein Zurücksetzen-Link wurde an ' + email + ' gesendet.');
                submitButton.classList.remove('loading');
                submitButton.disabled = false;
                resetForm.reset();
            }, 2000);
        });

        document.getElementById('email').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                resetForm.dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
