<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account-Einstellungen | Dein Projekt</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        /* Forum-like base styles */
        :root { color-scheme: dark; font-family: 'Inter', system-ui, sans-serif; }
        * { box-sizing: border-box; }
        body { margin:0; min-height:100vh; display:flex; justify-content:center; padding:2rem; color:#e2e8f0; position:relative; background:#020617; }
        .background-panel { position: fixed; inset: 0; z-index:-1; background-color: #020617; background-image: linear-gradient(180deg, rgba(2,6,23,0.95) 0%, rgba(2,6,23,0.65) 70%), url('riesenrad.jpg'); background-size: cover; background-position: center; background-repeat: no-repeat; }
        .layout { width: min(1100px, 100%); display:grid; grid-template-columns: 240px 1fr; gap:1.5rem; align-items:start; }
        .topbar { display:flex; justify-content:space-between; align-items:center; gap:1rem; padding:1rem 1.5rem; border-radius:28px; background: rgba(15,23,42,0.85); border:1px solid rgba(148,163,184,0.18); box-shadow:0 16px 40px rgba(0,0,0,0.35); }
        .topbar-left .brand-strip { text-transform:uppercase; letter-spacing:0.22em; font-size:0.95rem; font-weight:700; color:#38bdf8; }
        .panel { background: rgba(15,23,42,0.92); border:1px solid rgba(71,85,105,0.24); border-radius:16px; padding:2rem; max-width:100%; box-shadow:0 10px 30px rgba(0,0,0,0.35); color: #e2e8f0; }
        h2 { margin-top:0; margin-bottom:0.5rem; font-weight:700; color:#f8fafc; }
        .meta { color:#94a3b8; margin-bottom:0.75rem; }
        .sidebar { position:sticky; top:2rem; align-self:start; background: rgba(15,23,42,0.90); border:1px solid rgba(71,85,105,0.18); border-radius:22px; padding:1.5rem 1.25rem; box-shadow:0 20px 40px rgba(0,0,0,0.3); }
        .sidebar h3 { margin:0 0 1rem 0; font-size:1rem; letter-spacing:0.08em; text-transform:uppercase; color:#60a5fa; }
        .sidebar button, .sidebar a.button-link { width:100%; text-align:left; display:inline-flex; align-items:center; gap:0.75rem; border:none; padding:12px 14px; border-radius:14px; background: rgba(71,85,105,0.12); color:#e2e8f0; font-weight:600; cursor:pointer; transition:background 0.2s ease; }
        .sidebar button.active, .sidebar button:hover, .sidebar a.button-link:hover { background: rgba(56,189,248,0.18); }
        .sidebar button.active { color:#fff; }
        .sidebar a.button-link { justify-content:center; margin-top:1rem; border:1px solid rgba(56,189,248,0.3); text-decoration:none; }
        .form-row { margin-bottom:1.25rem; }
        label { display:block; margin-bottom:0.5rem; color:#94a3b8; font-weight:600; }
        input { width:100%; padding:12px 14px; border-radius:12px; border:1px solid rgba(71,85,105,0.5); background:#0f172a; color:#e2e8f0; }
        input::placeholder { color:#64748b; }
        button { background:#38bdf8; color:#0f172a; border:none; padding:12px 14px; border-radius:12px; font-weight:700; cursor:pointer; }
        .button-secondary { background:#334155; color:#e2e8f0; }
        .message { margin-top:1rem; display:none; padding:12px 14px; border-radius:12px; }
        .success { background:#153f28; color:#bbf7d0; border:1px solid #22c55e; }
        .error { background:#521010; color:#fecaca; border:1px solid #fca5a5; }
    </style>
</head>
<body>
    <div class="background-panel"></div>
    <div class="layout">
        <aside class="sidebar" role="navigation" aria-label="Einstellungen">
            <h3>Heimatfest Menü</h3>
            <button type="button" class="active" data-target="section-fullName">Name ändern</button>
            <button type="button" data-target="section-newEmail">E-Mail ändern</button>
            <button type="button" data-target="section-newPassword">Passwort zurücksetzen</button>
            <a href="forum.html" class="button-link">Zurück zum Forum</a>
        </aside>

        <main class="panel" role="main">
            <h2>Account-Einstellungen</h2>
            <p>Nur angemeldete Benutzer kommen hierher. Du kannst dein Profil ansehen, aktualisieren oder dich abmelden.</p>
            <div class="meta">Eingeloggt als: <strong id="userEmail">Lade...</strong></div>
            <div class="meta">Benutzer-ID: <strong id="userId">Lade...</strong></div>

            <form id="profileForm">
                <section id="section-fullName" class="form-section">
                    <h3>Name ändern</h3>
                    <div class="form-row">
                        <label for="fullName">Name / Anzeige</label>
                        <input type="text" id="fullName" placeholder="Dein Name" autocomplete="name">
                    </div>
                </section>

                <section id="section-newEmail" class="form-section">
                    <h3>E-Mail ändern</h3>
                    <div class="form-row">
                        <label for="newEmail">Neue E-Mail (optional)</label>
                        <input type="email" id="newEmail" placeholder="neue@mail.de" autocomplete="email">
                    </div>
                </section>

                <section id="section-newPassword" class="form-section">
                    <h3>Passwort zurücksetzen</h3>
                    <div class="form-row">
                        <label for="newPassword">Neues Passwort</label>
                        <input type="password" id="newPassword" placeholder="Neue Passwort" autocomplete="new-password">
                    </div>
                </section>

                <button type="submit">Profil aktualisieren</button>
            </form>

            <div style="margin-top:1rem; display:flex; gap:0.75rem;">
                <button id="logoutButton" type="button" class="button-secondary">Abmelden</button>
            </div>

            <div id="message" class="message"></div>
        </main>
    </div>
    <script>
        const SUPABASE_URL = 'https://pcxhlgnlrlsnlpmgcbai.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_eKRCiIBSRE_6al_hc0rOHA_P5wL6KeQ';
        let client = null;

        function showMessage(text, type = 'error') {
            const msg = document.getElementById('message');
            msg.textContent = text;
            msg.className = 'message ' + type;
            msg.style.display = 'block';
        }

        async function loadUser() {
            const { data, error } = await client.auth.getUser();
            if (error || !data?.user) {
                window.location.href = 'login.html';
                return;
            }
            const user = data.user;
            document.getElementById('userEmail').textContent = user.email || 'Unbekannt';
            document.getElementById('userId').textContent = user.id;
            document.getElementById('fullName').value = user.user_metadata?.full_name || '';
        }

        async function updateProfile(event) {
            event.preventDefault();
            const fullName = document.getElementById('fullName').value.trim();
            const newEmail = document.getElementById('newEmail').value.trim();
            const newPassword = document.getElementById('newPassword').value.trim();

            if (newPassword && newPassword.length < 8) {
                showMessage('Das neue Passwort muss mindestens 8 Zeichen lang sein.', 'error');
                return;
            }

            const updateData = { data: { full_name: fullName } };
            if (newEmail) {
                updateData.email = newEmail;
            }
            if (newPassword) {
                updateData.password = newPassword;
            }

            const { data, error } = await client.auth.updateUser(updateData);
            if (error) {
                showMessage('Fehler: ' + error.message, 'error');
                return;
            }

            showMessage('Profil aktualisiert!', 'success');
            if (data?.user?.email) {
                document.getElementById('userEmail').textContent = data.user.email;
            }
            document.getElementById('newEmail').value = '';
            document.getElementById('newPassword').value = '';
        }

        async function logout() {
            await client.auth.signOut();
            window.location.href = 'login.html';
        }

        window.addEventListener('DOMContentLoaded', async () => {
            if (typeof supabase === 'undefined') {
                document.body.innerHTML = '<div style="padding: 2rem; font-family: sans-serif;">Supabase konnte nicht geladen werden. Bitte Seite neu laden.</div>';
                return;
            }
            client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
            await loadUser();
            document.getElementById('profileForm').addEventListener('submit', updateProfile);
            document.getElementById('logoutButton').addEventListener('click', logout);

            document.querySelectorAll('.sidebar button').forEach((button) => {
                button.addEventListener('click', () => {
                    document.querySelectorAll('.sidebar button').forEach((btn) => btn.classList.remove('active'));
                    button.classList.add('active');
                    const targetId = button.dataset.target;
                    const target = document.getElementById(targetId);
                    if (target) {
                        target.scrollIntoView({ behavior: 'smooth', block: 'start' });
                        target.querySelector('input')?.focus();
                    }
                });
            });
        });
    </script>
</body>
</html>
